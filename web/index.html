<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Olivone</title>
    <script>
      // Applique le thème avant le rendu pour éviter le flash clair/sombre.
      try {
        var t = localStorage.getItem('olivone-theme') || 'auto';
        if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
