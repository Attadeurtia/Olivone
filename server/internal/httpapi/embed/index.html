<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Olivone</title>
    <style>
      :root {
        --bg: #f7f7f5; --card: #ffffff; --fg: #1b1b1a; --muted: #6b6b66;
        --accent: #4f7d5b; --border: #e3e3df;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #16171a; --card: #1e2024; --fg: #e9e9e6; --muted: #9a9a94;
          --accent: #7fb98b; --border: #2c2e33;
        }
      }
      :root[data-theme="dark"] {
        --bg: #16171a; --card: #1e2024; --fg: #e9e9e6; --muted: #9a9a94;
        --accent: #7fb98b; --border: #2c2e33;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: grid; place-items: center;
      }
      .card {
        background: var(--card); border: 1px solid var(--border); border-radius: 14px;
        padding: 32px 36px; max-width: 460px; width: calc(100% - 32px);
        box-shadow: 0 6px 24px rgba(0,0,0,.06);
      }
      h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
      .sub { margin: 0 0 20px; color: var(--muted); }
      .status { font-size: 14px; padding: 10px 12px; border: 1px solid var(--border);
        border-radius: 10px; background: color-mix(in srgb, var(--accent) 10%, transparent); }
      .status b { color: var(--accent); }
      .themes { display: flex; gap: 6px; margin-top: 20px; }
      button {
        flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px;
        background: transparent; color: var(--fg); cursor: pointer; font-size: 13px;
      }
      button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      .foot { margin-top: 18px; color: var(--muted); font-size: 12.5px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Olivone</h1>
      <p class="sub">Candidatures &amp; lettres de motivation — squelette M0.</p>
      <p class="status" id="status">API : <span id="apihealth">vérification…</span></p>
      <div class="themes">
        <button data-t="auto">Auto</button>
        <button data-t="light">Jour</button>
        <button data-t="dark">Nuit</button>
      </div>
      <p class="foot">Frontend non encore construit : cette page est le placeholder embarqué.</p>
    </div>
    <script>
      const root = document.documentElement;
      function apply(t) {
        if (t === "auto") root.removeAttribute("data-theme");
        else root.setAttribute("data-theme", t);
        document.querySelectorAll("button[data-t]").forEach(function (b) {
          b.classList.toggle("active", b.dataset.t === t);
        });
      }
      let current = "auto";
      try { current = localStorage.getItem("olivone-theme") || "auto"; } catch (e) {}
      apply(current);
      document.querySelectorAll("button[data-t]").forEach(function (b) {
        b.addEventListener("click", function () {
          current = b.dataset.t;
          try { localStorage.setItem("olivone-theme", current); } catch (e) {}
          apply(current);
        });
      });
      fetch("/api/health").then(function (r) { return r.json(); }).then(function (j) {
        document.getElementById("apihealth").innerHTML =
          "<b>" + j.status + "</b> · v" + j.version + " · " + j.env;
      }).catch(function () {
        document.getElementById("apihealth").textContent = "hors ligne";
      });
    </script>
  </body>
</html>
